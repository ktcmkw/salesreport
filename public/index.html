<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Timeline 2026</title>
<style>
:root{
  --bg:#EEF1F8;--surface:#FFF;--surface2:#F5F7FB;--border:#E2E8F0;--border2:#C5CFE0;
  --tx1:#0F172A;--tx2:#1E293B;--tx3:#64748B;--tx4:#94A3B8;
  --accent:#2563EB;--accent-bg:#EFF6FF;--accent-lt:#BFDBFE;
  --green:#059669;--green-bg:#ECFDF5;
  --amber:#D97706;--amber-bg:#FFFBEB;
  --rose:#E11D48;--rose-bg:#FFF1F2;
  --teal:#0D9488;--teal-bg:#F0FDFA;
  --purple:#7C3AED;--purple-bg:#F5F3FF;
  --sb:256px;
  --sh:0 1px 4px rgba(0,0,0,.07);--sh-md:0 4px 18px rgba(0,0,0,.10);--sh-lg:0 8px 36px rgba(0,0,0,.13)
}
[data-theme="dark"]{
  --bg:#07101E;--surface:#0F1C30;--surface2:#162032;--border:#1C2D44;--border2:#263D5C;
  --tx1:#F0F6FF;--tx2:#9BB8D8;--tx3:#4D6888;--tx4:#2E4460;
  --accent:#60A5FA;--accent-bg:#0A1D3A;--accent-lt:#1A365A;
  --green:#34D399;--green-bg:#03200F;
  --amber:#FBBF24;--amber-bg:#1C1400;
  --rose:#FB7185;--rose-bg:#1C0614;
  --teal:#2DD4BF;--teal-bg:#021D18;
  --purple:#A78BFA;--purple-bg:#0F0A26;
  --sh:0 1px 6px rgba(0,0,0,.4);--sh-md:0 4px 20px rgba(0,0,0,.5);--sh-lg:0 8px 36px rgba(0,0,0,.65)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Prompt,sans-serif;
  background:var(--bg);color:var(--tx1);font-size:14px;display:flex;transition:background .3s,color .3s}

/* ═══ SIDEBAR ═══ */
.sb{width:var(--sb);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  height:100vh;overflow-y:auto;display:flex;flex-direction:column;box-shadow:var(--sh-md);z-index:10;position:relative}
.sb::-webkit-scrollbar{width:3px}
.sb::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* Logo */
.sb-logo{padding:16px 14px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,#2563EB 0%,#7C3AED 100%);
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 4px 14px rgba(37,99,235,.4)}
.brand-name{font-size:15px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.brand-name span{color:var(--accent)}
.brand-sub{font-size:9px;color:var(--tx4);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

.sb-sec{padding:12px 12px;border-bottom:1px solid var(--border)}
.sb-lbl{font-size:9px;font-weight:800;color:var(--tx4);text-transform:uppercase;letter-spacing:.12em;margin-bottom:9px;padding:0 2px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.kpi{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 10px 8px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px}
.kpi.k1::before{background:linear-gradient(90deg,#2563EB,#7C3AED)}
.kpi.k2::before{background:linear-gradient(90deg,#0D9488,#059669)}
.kpi.k3::before{background:linear-gradient(90deg,#D97706,#DC2626)}
.kpi.k4::before{background:linear-gradient(90deg,#7C3AED,#E11D48)}
.kpi-n{font-size:21px;font-weight:900;line-height:1}
.kpi.k1 .kpi-n{color:var(--accent)}.kpi.k2 .kpi-n{color:var(--teal)}
.kpi.k3 .kpi-n{color:var(--amber)}.kpi.k4 .kpi-n{color:var(--purple)}
.kpi-l{font-size:9px;font-weight:700;color:var(--tx4);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}

/* Sender */
.sb-sender{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;transition:border-color .15s}
.sb-sender:focus-within{border-color:var(--accent)}
.sb-sender svg{color:var(--tx4);width:12px;height:12px;flex-shrink:0}
.sb-sinp{border:none;background:none;font-size:12px;color:var(--tx2);outline:none;width:100%;font-family:inherit}

/* Filters */
.sb-filters{display:flex;flex-direction:column;gap:1px}
.sbf{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:7px;border:none;background:none;cursor:pointer;font-size:12px;color:var(--tx2);text-align:left;width:100%;transition:all .12s;font-family:inherit}
.sbf:hover{background:var(--surface2);color:var(--tx1)}
.sbf.on{background:var(--accent-bg);color:var(--accent);font-weight:700}
.sbf-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sbf-cnt{margin-left:auto;font-size:10px;font-weight:700;background:var(--border);color:var(--tx3);padding:1px 6px;border-radius:10px;min-width:20px;text-align:center}
.sbf.on .sbf-cnt{background:var(--accent);color:#fff}

/* Mini calendar */
.cal-nav-row{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.cal-nb{width:24px;height:24px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:13px;font-family:inherit;transition:all .12s}
.cal-nb:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.cal-m-lbl{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--tx2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:1px}
.cal-dow{font-size:8px;font-weight:700;color:var(--tx4);padding:2px 0;text-transform:uppercase}
.cal-d{font-size:11px;padding:5px 2px;border-radius:5px;cursor:pointer;border:1.5px solid transparent;line-height:1.1;transition:all .1s;color:var(--tx3)}
.cal-d:hover:not(.oth){background:var(--accent-bg);color:var(--accent)}
.cal-d.oth{color:var(--tx4);opacity:.4;cursor:default}
.cal-d.today{border-color:var(--accent);color:var(--accent);font-weight:700}
.cal-d.rs,.cal-d.re{background:var(--accent);color:#fff;font-weight:700}
.cal-d.ir{background:var(--accent-lt);color:var(--accent)}
.cal-d.dot::after{content:'';display:block;width:3px;height:3px;border-radius:50%;background:currentColor;margin:1px auto 0;opacity:.65}
.cal-d.rs.dot::after,.cal-d.re.dot::after{background:#fff}
.cal-foot{margin-top:8px;display:flex;gap:4px;align-items:center}
.cal-rtxt{flex:1;font-size:10px;color:var(--tx4);line-height:1.4}
.cal-clr{font-size:11px;color:var(--rose);cursor:pointer;background:none;border:none;font-family:inherit}
.cal-apl{padding:4px 10px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}

/* Countdown */
.countdown-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.cd-icon{font-size:14px}
.cd-info{flex:1;min-width:0}
.cd-lbl{font-size:10px;color:var(--tx4);font-weight:600}
.cd-time{font-size:16px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.cd-bar{height:3px;background:var(--border);border-radius:3px;margin-top:5px;overflow:hidden}
.cd-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width 1s linear;width:100%}

/* Fetch btn */
.sb-fbtn{width:100%;padding:8px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.sb-fbtn:hover{opacity:.88}
.sb-fbtn:disabled{opacity:.5;cursor:default}
.sb-status{font-size:10px;color:var(--tx4);text-align:center;margin-top:5px}

/* Theme */
.sb-theme{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 14px;margin-top:auto}
.sb-theme-lbl{font-size:11px;color:var(--tx4);font-weight:600}
.tt{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px;gap:2px}
.tto{padding:4px 9px;border-radius:16px;border:none;background:none;font-size:10px;font-weight:700;cursor:pointer;color:var(--tx3);font-family:inherit;transition:all .12s}
.tto.on{background:var(--accent);color:#fff}

/* ═══ MAIN ═══ */
.main{flex:1;min-width:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.main-top{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:50px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;flex-shrink:0;box-shadow:var(--sh)}
.main-title{font-size:15px;font-weight:800;color:var(--tx1)}
.main-sub{font-size:11px;color:var(--tx3)}
.f1{flex:1}
.result-badge{font-size:11px;color:var(--tx3);background:var(--surface2);border:1px solid var(--border);padding:3px 10px;border-radius:20px;display:none}
.srch-wrap{position:relative}
.srch-ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--tx4);pointer-events:none;width:12px;height:12px}
.srch-inp{padding:6px 10px 6px 28px;font-size:12px;font-family:inherit;border:1.5px solid var(--border);border-radius:20px;background:var(--surface2);color:var(--tx1);outline:none;width:200px;transition:all .15s}
.srch-inp:focus{border-color:var(--accent);width:260px}

/* Feed */
.feed-wrap{padding:20px 24px 80px}

/* Month sep */
.month-sep{display:flex;align-items:center;gap:12px;margin:28px 0 14px}
.month-sep:first-child{margin-top:0}
.month-sep::before,.month-sep::after{content:'';flex:1;height:1.5px;background:var(--border)}
.mpill{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tx1);background:var(--surface);border:2px solid var(--border2);padding:4px 14px;border-radius:20px;white-space:nowrap}
.mcnt{font-size:10px;color:var(--tx4)}

/* Day */
.day-lbl{font-size:10px;font-weight:700;color:var(--tx4);margin:12px 0 7px 88px;display:flex;align-items:center;gap:8px}
.day-lbl::after{content:'';flex:1;height:1px;background:var(--border)}

/* TL row */
.tl-row{display:flex;margin-bottom:10px;align-items:flex-start}
.tl-dc{width:52px;flex-shrink:0;text-align:right;padding-right:6px;padding-top:12px}
.tl-dn{font-size:19px;font-weight:900;color:var(--tx3);line-height:1}
.tl-dw{font-size:9px;font-weight:700;color:var(--tx4);text-transform:uppercase;letter-spacing:.05em}
.tl-sp{width:36px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;position:relative}
.tl-sp::before{content:'';position:absolute;top:0;bottom:-10px;left:50%;width:2px;background:var(--border);transform:translateX(-50%);z-index:0}
.tl-nd{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:1;position:relative;margin-top:8px;border:2.5px solid var(--surface);transition:transform .2s;flex-shrink:0}
.tl-nd:hover{transform:scale(1.12)}
.n-visit {background:var(--accent-bg);box-shadow:0 0 0 2px var(--accent)}
.n-bill  {background:var(--teal-bg);  box-shadow:0 0 0 2px var(--teal)}
.n-quote {background:var(--amber-bg); box-shadow:0 0 0 2px var(--amber)}
.n-retail{background:var(--rose-bg);  box-shadow:0 0 0 2px var(--rose)}
.n-support{background:var(--purple-bg);box-shadow:0 0 0 2px var(--purple)}
.n-other {background:var(--surface2); box-shadow:0 0 0 2px var(--border2)}
.tl-body{flex:1;min-width:0;padding-top:4px;padding-left:8px}

/* Card */
.tl-card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:box-shadow .2s,border-color .2s,transform .18s;position:relative}
.tl-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px}
.cv-visit::before {background:var(--accent)}
.cv-bill::before  {background:var(--teal)}
.cv-quote::before {background:var(--amber)}
.cv-retail::before{background:var(--rose)}
.cv-support::before{background:var(--purple)}
.cv-other::before {background:var(--border2)}
.tl-card:hover{border-color:var(--border2);box-shadow:var(--sh-lg);transform:translateY(-1px)}
.tl-card.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-lt),var(--sh-md)}

.c-hd{display:flex;align-items:flex-start;gap:10px;padding:13px 16px 8px 18px}
.c-meta{flex:1;min-width:0}
.c-r1{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.tbdg{font-size:10px;font-weight:800;padding:2px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em}
.tb-visit {background:var(--accent-bg);color:var(--accent)}
.tb-bill  {background:var(--teal-bg);  color:var(--teal)}
.tb-quote {background:var(--amber-bg); color:var(--amber)}
.tb-retail{background:var(--rose-bg);  color:var(--rose)}
.tb-support{background:var(--purple-bg);color:var(--purple)}
.tb-other {background:var(--surface2); color:var(--tx3);border:1px solid var(--border)}
.new-bdg{font-size:10px;font-weight:800;color:#fff;background:var(--accent);padding:2px 8px;border-radius:20px}
.c-subj{font-size:15px;font-weight:700;color:var(--tx1);line-height:1.35;margin-bottom:4px}
.c-subj.unread{color:var(--accent)}
/* Snippet — show multiple lines properly */
.c-snip{font-size:12px;color:var(--tx3);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-right{flex-shrink:0;text-align:right}
.c-time{font-size:11px;font-weight:700;color:var(--tx3);white-space:nowrap}
.c-chev{font-size:11px;color:var(--tx4);margin-top:5px;display:block;transition:transform .2s}
.tl-card.open .c-chev{transform:rotate(180deg)}

.c-tags{display:flex;gap:5px;flex-wrap:wrap;padding:0 16px 11px 18px}
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.t-unread{background:var(--accent-bg);color:var(--accent)}
.t-read  {background:var(--green-bg); color:var(--green)}
.t-attach{background:var(--purple-bg);color:var(--purple)}
.t-imp   {background:var(--amber-bg); color:var(--amber)}
.t-thread{background:var(--surface2); color:var(--tx3);border:1px solid var(--border)}

/* Detail */
.c-det{display:none;border-top:1.5px solid var(--border)}
.tl-card.open .c-det{display:block}
.conv-list{padding:10px 12px;display:flex;flex-direction:column;gap:6px}

/* Conversation message */
.conv-msg{background:var(--surface2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.conv-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;transition:background .12s;user-select:none}
.conv-hd:hover{background:rgba(0,0,0,.03)}
[data-theme="dark"] .conv-hd:hover{background:rgba(255,255,255,.04)}
.conv-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.conv-info{flex:1;min-width:0}
.conv-nm{font-size:12px;font-weight:700;color:var(--tx1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-em{font-size:10px;color:var(--tx4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-rt{flex-shrink:0;text-align:right}
.conv-ts{font-size:10px;color:var(--tx3);font-weight:600;white-space:nowrap}
.conv-tp{font-size:9px;font-weight:800;padding:1px 6px;border-radius:20px;margin-top:2px;display:inline-block;white-space:nowrap}
.ct-fwd{background:var(--amber-bg);color:var(--amber)}
.ct-re {background:var(--teal-bg);  color:var(--teal)}
.ct-new{background:var(--accent-bg);color:var(--accent)}
.conv-undot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.conv-chv{font-size:10px;color:var(--tx4);transition:transform .2s;flex-shrink:0;margin-left:4px}
.conv-msg.open .conv-chv{transform:rotate(180deg)}

/* Conversation body */
.conv-bd{display:none;border-top:1px solid var(--border);background:var(--surface)}
.conv-msg.open .conv-bd{display:block}
.conv-bd-inner{padding:12px 14px}
.conv-grid{display:grid;grid-template-columns:36px 1fr;gap:3px 8px;font-size:11px;margin-bottom:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.conv-mk{color:var(--tx4);font-weight:700;align-self:start;padding-top:1px}
.conv-mv{color:var(--tx3);word-break:break-all;line-height:1.5}
/* Snippet displayed as real text */
.conv-text{font-size:13px;color:var(--tx2);line-height:1.75;word-break:break-word;white-space:pre-wrap}
.conv-text.compact{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.txt-toggle{display:flex;align-items:center;gap:2px;margin-bottom:8px}
.txt-toggle span{font-size:9px;font-weight:700;color:var(--tx4);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.txt-btn{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;border:1.5px solid var(--border2);background:none;cursor:pointer;color:var(--tx3);font-family:inherit;transition:all .12s}
.txt-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Image gallery */
.img-gallery{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.img-thumb{max-width:180px;max-height:140px;border-radius:8px;border:1px solid var(--border);object-fit:cover;cursor:pointer;transition:transform .15s;box-shadow:var(--sh)}
.img-thumb:hover{transform:scale(1.03);box-shadow:var(--sh-md)}
/* Attachment pills */
.att-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.att-pill{display:flex;align-items:center;gap:5px;background:var(--purple-bg);color:var(--purple);font-size:11px;font-weight:700;padding:4px 10px;border-radius:7px}

/* Connector */
.conv-conn{display:flex;align-items:center;padding:0 8px;gap:8px}
.conn-line{flex:1;height:0;border-top:1px dashed var(--border2)}
.conn-lbl{font-size:9px;color:var(--tx4);font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}

/* Image lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:10px;box-shadow:0 0 60px rgba(0,0,0,.5)}

/* States */
.state-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 0;gap:16px;color:var(--tx4)}
.spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.s-ico{font-size:48px}.s-txt{font-size:15px;font-weight:700;color:var(--tx3)}
.s-sub{font-size:13px;color:var(--tx4);max-width:340px;text-align:center;line-height:1.65}
.err-bar{background:var(--rose-bg);color:var(--rose);border:1px solid var(--rose);border-radius:10px;padding:12px 18px;margin-bottom:18px;font-size:13px;font-weight:600;display:none}
.toast{position:fixed;bottom:22px;right:22px;background:var(--tx1);color:var(--bg);font-size:13px;font-weight:700;padding:10px 20px;border-radius:12px;box-shadow:var(--sh-lg);opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;z-index:300}
.toast.on{opacity:1;transform:translateY(0)}
*::-webkit-scrollbar{width:5px;height:5px}
*::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sb">
  <div class="sb-logo">
    <div class="logo-mark">📈</div>
    <div>
      <div class="brand-name">Sales<span>Timeline</span></div>
      <div class="brand-sub">ฝ่ายขาย · 2026</div>
    </div>
  </div>

  <div class="sb-sec">
    <div class="sb-lbl">ภาพรวม</div>
    <div class="kpi-grid">

        <input class="sb-sinp" id="sender-inp" value="boypeo81@gmail.com" placeholder="email ผู้ส่ง...">

      <div class="sb-sender" style="border-color:var(--green)">

      <button class="sbf"    data-f="visit"   onclick="setF(this,'visit')"><span class="sbf-dot" style="background:var(--accent)"></span>👥 เข้าพบลูกค้า<span class="sbf-cnt" id="c-visit">0</span></button>
      <button class="sbf"    data-f="bill"    onclick="setF(this,'bill')"><span class="sbf-dot" style="background:var(--teal)"></span>🧾 วางบิล<span class="sbf-cnt" id="c-bill">0</span></button>
      <button class="sbf"    data-f="quote"   onclick="setF(this,'quote')"><span class="sbf-dot" style="background:var(--amber)"></span>💰 เสนอราคา<span class="sbf-cnt" id="c-quote">0</span></button>
      <button class="sbf"    data-f="retail"  onclick="setF(this,'retail')"><span class="sbf-dot" style="background:var(--rose)"></span>🛒 รีเทล/Lotus<span class="sbf-cnt" id="c-retail">0</span></button>
      <button class="sbf"    data-f="support" onclick="setF(this,'support')"><span class="sbf-dot" style="background:var(--purple)"></span>🔧 ซ่อม/ประกัน<span class="sbf-cnt" id="c-support">0</span></button>
      <button class="sbf"    data-f="unread"  onclick="setF(this,'unread')"><span class="sbf-dot" style="background:var(--accent)"></span>● ยังไม่อ่าน<span class="sbf-cnt" id="c-unread">0</span></button>
      <button class="sbf"    data-f="attach"  onclick="setF(this,'attach')"><span class="sbf-dot" style="background:var(--purple)"></span>📎 มีไฟล์แนบ<span class="sbf-cnt" id="c-attach2">0</span></button>

        <div class="cd-bar"><div class="cd-bar-fill" id="cd-bar"></div></div>
      </div>

      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0115-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 01-15 6.7L3 16"/></svg>
      รีเฟรชเดี๋ยวนี้

      <button class="tto" id="tt-d" onclick="setTheme('dark')">🌙 Dark</button>

<!-- MAIN -->
<div class="main">
  <div class="main-top">
    <div><div class="main-title">Activity Timeline</div><div class="main-sub" id="main-sub">ฝ่ายขาย ปี 2026</div></div>
    <div class="f1"></div>
    <span class="result-badge" id="result-badge"></span>
    <div class="srch-wrap">
      <svg class="srch-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="srch-inp" id="srch" placeholder="ค้นหา..." oninput="render()">
    </div>
  </div>

    <div class="err-bar" id="err-bar"></div>
    <div id="feed">
      <div class="state-box"><div class="spinner"></div><div class="s-txt">กำลังโหลดข้อมูล...</div></div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="this.classList.remove('on')">
  <img id="lb-img" src="" alt="" onclick="event.stopPropagation()">
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ───────────────────────────────────────────────
const LABEL_MAP={retail:['Label_162140898920016432','Label_4309735334019123715','Label_2545236837843309505']};
const KW={
  visit:['เข้าพบ','เยี่ยม','visit','report','สรุปงาน','รายงาน','ติดตาม'],
  bill: ['วางบิล','บิล','invoice','ใบแจ้ง','ส่งสินค้า','delivery','จัดส่ง'],
  quote:['เสนอราคา','ราคา','quotation','quote','rfq','ใบเสนอ'],
  support:['ประกัน','warranty','เคลม','claim','ซ่อม','repair','complaint'],
};
const CAT={
  visit: {icon:'👥',label:'เข้าพบลูกค้า',cv:'cv-visit', nv:'n-visit', tb:'tb-visit'},
  bill:  {icon:'🧾',label:'วางบิล',       cv:'cv-bill',  nv:'n-bill',  tb:'tb-bill'},
  quote: {icon:'💰',label:'เสนอราคา',     cv:'cv-quote', nv:'n-quote', tb:'tb-quote'},
  retail:{icon:'🛒',label:'รีเทล/Lotus',  cv:'cv-retail',nv:'n-retail',tb:'tb-retail'},
  support:{icon:'🔧',label:'ซ่อม/ประกัน',cv:'cv-support',nv:'n-support',tb:'tb-support'},
  other: {icon:'📋',label:'อื่น ๆ',       cv:'cv-other', nv:'n-other', tb:'tb-other'},
};
const TH_M=['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_D=['อา','จ','อ','พ','พฤ','ศ','ส'];
const AVC=['#2563EB','#7C3AED','#0D9488','#D97706','#E11D48','#059669','#0EA5E9'];

// ── State ─────────────────────────────────────────────────
let all=[],curF='all';
let dateFrom='2026/01/01',dateTo='2026/12/31';
let calY=2026,calM=0,selS=null,selE=null,picking=false,dots=new Set();
const REFRESH_SEC=120;
let cdSec=REFRESH_SEC,cdTimer=null,fetchTimer=null;

// ── Theme ─────────────────────────────────────────────────
(()=>{const t=localStorage.getItem('sl-th')||'light';applyTheme(t)})();
function setTheme(t){applyTheme(t);localStorage.setItem('sl-th',t)}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('tt-l').classList.toggle('on',t==='light');
  document.getElementById('tt-d').classList.toggle('on',t==='dark');
}

// ── Countdown ─────────────────────────────────────────────
function startCountdown(){
  clearInterval(cdTimer);
  cdSec=REFRESH_SEC;
  cdTimer=setInterval(()=>{
    cdSec--;
    if(cdSec<=0){cdSec=REFRESH_SEC;fetchData();}
    const m=Math.floor(cdSec/60),s=cdSec%60;
    document.getElementById('cd-time').textContent=m+':'+(s<10?'0':'')+s;
    document.getElementById('cd-bar').style.width=(cdSec/REFRESH_SEC*100)+'%';
  },1000);
}

// ── Calendar ──────────────────────────────────────────────
function calMove(d){calM+=d;if(calM>11){calM=0;calY++}if(calM<0){calM=11;calY--}renderCal()}
function renderCal(){
  document.getElementById('cal-hd').textContent=TH_M[calM+1]+' '+calY;
  const g=document.getElementById('cal-grid');
  let h=TH_D.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first=new Date(calY,calM,1).getDay();
  const last=new Date(calY,calM+1,0).getDate();
  const pLast=new Date(calY,calM,0).getDate();
  const today=new Date();
  for(let i=0;i<first;i++) h+=`<div class="cal-d oth">${pLast-first+1+i}</div>`;
  for(let d=1;d<=last;d++){
    const key=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dO=new Date(calY,calM,d);
    const isToday=dO.toDateString()===today.toDateString();
    let c='cal-d';
    if(dots.has(key))c+=' dot';
    if(selS&&selE){
      const ds=new Date(selS),de=new Date(selE);
      if(dO.toDateString()===ds.toDateString())c+=' rs';
      else if(dO.toDateString()===de.toDateString())c+=' re';
      else if(dO>ds&&dO<de)c+=' ir';
    }else if(selS&&new Date(selS).toDateString()===dO.toDateString())c+=' rs';
    if(isToday&&!c.includes('rs')&&!c.includes('re')&&!c.includes('ir'))c+=' today';
    h+=`<div class="${c}" onclick="calClick(${calY},${calM+1},${d})">${d}</div>`;
  }
  const rem=(7-(first+last)%7)%7;
  for(let i=1;i<=rem;i++) h+=`<div class="cal-d oth">${i}</div>`;
  g.innerHTML=h;
  const el=document.getElementById('cal-txt');
  el.textContent=!selS?'คลิกเลือกวันเริ่มต้น':!selE?'คลิกเลือกวันสิ้นสุด':`${fmtD(selS)} → ${fmtD(selE)}`;
}
function calClick(y,m,d){
  const s=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  if(!selS||selE){selS=s;selE=null;picking=true}
  else if(picking){const a=new Date(selS),b=new Date(s);if(b<a){selE=selS;selS=s}else selE=s;picking=false;}
  renderCal();
}
function calClear(){selS=null;selE=null;picking=false;dateFrom='2026/01/01';dateTo='2026/12/31';renderCal()}
function calApply(){if(selS){dateFrom=selS.replace(/-/g,'/');dateTo=(selE||selS).replace(/-/g,'/')}fetchData()}
function fmtD(s){const p=s.split('-');return`${parseInt(p[2])} ${TH_M[parseInt(p[1])].slice(0,3)}`}

// ── Classify ──────────────────────────────────────────────
function classify(t){
  const s=t.messages.map(m=>m.subject+' '+m.snippet).join(' ').toLowerCase();
  if(LABEL_MAP.retail.some(l=>t.messages.some(m=>(m.labelIds||[]).includes(l)))) return 'retail';
  for(const[k,ws]of Object.entries(KW))if(ws.some(w=>s.includes(w)))return k;
  return 'other';
}

// ── Filter ────────────────────────────────────────────────
function setF(el,f){curF=f;document.querySelectorAll('.sbf').forEach(b=>b.classList.remove('on'));el.classList.add('on');render()}

// ── Fetch ─────────────────────────────────────────────────
async function fetchData(){
  const sender=document.getElementById('sender-inp').value.trim()||'boypeo81@gmail.com';
  document.getElementById('fetch-btn').disabled=true;
  document.getElementById('feed').innerHTML='<div class="state-box"><div class="spinner"></div><div class="s-txt">กำลังโหลด...</div></div>';
  document.getElementById('err-bar').style.display='none';
  try{
    const recip=(document.getElementById('recip-inp')?.value||'').trim();
    const recipParam=recip?`&recipient=${encodeURIComponent(recip)}`:'';
    const r=await fetch(`/api/threads?sender=${encodeURIComponent(sender)}&after=${dateFrom}&before=${dateTo}&max=50${recipParam}`);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    all=(d.threads||[]).map(t=>({...t,cat:classify(t)}));
    dots=new Set();
    all.forEach(t=>{
      const dd=new Date(t.messages[t.messages.length-1].date);
      dots.add(`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`);
    });
    renderCal();updateKPI();render();
    document.getElementById('sb-status').textContent='อัปเดต '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
    toast('โหลดสำเร็จ '+all.length+' รายการ ✓');
    startCountdown();
  }catch(ex){
    const el=document.getElementById('err-bar');el.textContent='⚠️ '+ex.message;el.style.display='block';
    document.getElementById('feed').innerHTML='<div class="state-box"><div class="s-ico">⚠️</div><div class="s-txt">ไม่สามารถโหลดได้</div><div class="s-sub">'+ex.message+'</div></div>';
  }
  document.getElementById('fetch-btn').disabled=false;
}

// ── KPI ───────────────────────────────────────────────────
function updateKPI(){
  const unread=all.filter(t=>t.messages.some(m=>(m.labelIds||[]).includes('UNREAD'))).length;
  const attach=all.filter(t=>t.hasAttach).length;
  const threads=all.filter(t=>t.messages.length>1).length;
  document.getElementById('k-total').textContent=all.length;
  document.getElementById('k-unread').textContent=unread;
  document.getElementById('k-attach').textContent=attach;
  document.getElementById('k-thread').textContent=threads;
  document.getElementById('c-all').textContent=all.length;
  ['visit','bill','quote','retail','support'].forEach(c=>{
    const el=document.getElementById('c-'+c);if(el)el.textContent=all.filter(t=>t.cat===c).length;
  });
  document.getElementById('c-unread').textContent=unread;
  document.getElementById('c-attach2').textContent=attach;
}

// ── Render ────────────────────────────────────────────────
function render(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  let data=all.filter(t=>{
    if(curF==='unread') return t.messages.some(m=>(m.labelIds||[]).includes('UNREAD'));
    if(curF==='attach') return t.hasAttach;
    if(curF!=='all')    return t.cat===curF;
    return true;
  });
  if(q) data=data.filter(t=>t.messages.some(m=>(m.subject||'').toLowerCase().includes(q)||(m.snippet||'').toLowerCase().includes(q)||(m.from||'').toLowerCase().includes(q)));
  data.sort((a,b)=>new Date(b.messages[b.messages.length-1].date)-new Date(a.messages[a.messages.length-1].date));

  const rb=document.getElementById('result-badge');
  if(data.length){rb.textContent=data.length+' รายการ';rb.style.display='inline-flex'}else rb.style.display='none';

  const feed=document.getElementById('feed');
  if(!data.length){
    feed.innerHTML='<div class="state-box"><div class="s-ico">🔍</div><div class="s-txt">ไม่พบรายการ</div><div class="s-sub">ลองเปลี่ยนตัวกรองหรือคีย์ค้นหา</div></div>';return;
  }

  // Group by month
  const months={};
  data.forEach(t=>{
    const d=new Date(t.messages[t.messages.length-1].date);
    const mk=d.getFullYear()+'-'+d.getMonth();
    if(!months[mk])months[mk]={lbl:TH_M[d.getMonth()+1]+' '+d.getFullYear(),items:[]};
    months[mk].items.push({t,d});
  });

  let html='';
  Object.entries(months).forEach(([,mon])=>{
    html+=`<div class="month-sep"><span class="mpill">${mon.lbl}</span><span class="mcnt">${mon.items.length} รายการ</span></div>`;
    const days={};
    mon.items.forEach(({t,d})=>{
      const dk=d.getDate()+' '+TH_M[d.getMonth()+1]+' '+d.getFullYear();
      if(!days[dk])days[dk]=[];days[dk].push({t,d});
    });
    Object.entries(days).forEach(([dlbl,items])=>{
      html+=`<div class="day-lbl">${dlbl}</div>`;
      items.forEach(({t,d})=>{
        const last=t.messages[t.messages.length-1];
        const cat=CAT[t.cat]||CAT.other;
        const unread=t.messages.some(m=>(m.labelIds||[]).includes('UNREAD'));
        const imp=t.messages.some(m=>(m.labelIds||[]).includes('IMPORTANT'));
        const time=d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
        const hasThread=t.messages.length>1;

        const tags=[];
        if(unread)tags.push('<span class="tag t-unread">● ยังไม่อ่าน</span>');
        else tags.push('<span class="tag t-read">✓ อ่านแล้ว</span>');
        if(t.hasAttach)tags.push('<span class="tag t-attach">📎 ไฟล์แนบ</span>');
        if(imp)tags.push('<span class="tag t-imp">⭐ สำคัญ</span>');
        if(hasThread)tags.push(`<span class="tag t-thread">↩ ${t.messages.length} ข้อความ</span>`);

        // Build conversation
        let convH='';
        t.messages.forEach((msg,idx)=>{
          const md=new Date(msg.date);
          const mt=md.toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
          const subj=(msg.subject||'').toLowerCase();
          const isFwd=subj.startsWith('fwd:')||subj.startsWith('fw:');
          const isRe=subj.startsWith('re:');
          const mUnread=(msg.labelIds||[]).includes('UNREAD');
          const fromRaw=msg.from||'';
          const fromName=fromRaw.replace(/<.*>/,'').trim()||fromRaw||'—';
          const fromAddr=fromRaw.match(/<(.+)>/)?.[1]||fromRaw;
          const color=AVC[(fromName.charCodeAt(0)||0)%AVC.length];
          const init=fromName.split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?';
          const typeHtml=isFwd?'<span class="conv-tp ct-fwd">↗ Forward</span>':isRe?'<span class="conv-tp ct-re">↩ Reply</span>':'<span class="conv-tp ct-new">✉ New</span>';

          if(idx>0){
            const lbl=isFwd?'ส่งต่อ (Forward)':isRe?'ตอบกลับ (Reply)':'ข้อความถัดไป';
            convH+=`<div class="conv-conn"><div class="conn-line"></div><span class="conn-lbl">${lbl}</span><div class="conn-line"></div></div>`;
          }

          // Attachments: images vs files
          const atts=msg.attachments||[];
          const imgs=atts.filter(a=>a.isImage);
          const files=atts.filter(a=>!a.isImage);

          const imgHtml=imgs.length?`<div class="img-gallery">${imgs.map(a=>{
            const src=a.data
              ?`data:${a.mimeType};base64,${a.data.replace(/-/g,'+').replace(/_/g,'/')}`
              :`/api/attachment/${msg.id}/${a.attachmentId}?mime=${encodeURIComponent(a.mimeType)}`;
            return`<img class="img-thumb" src="${src}" alt="${e(a.filename)}" onclick="event.stopPropagation();openLB(this.src)" loading="lazy">`;
          }).join('')}</div>`:'';

          const fileHtml=files.length?`<div class="att-list">${files.map(a=>`<div class="att-pill">📎 ${e(a.filename)}</div>`).join('')}</div>`:'';

          const isLast=idx===t.messages.length-1;
          convH+=`<div class="conv-msg${isLast?' open':''}">
  <div class="conv-hd" onclick="event.stopPropagation();this.parentElement.classList.toggle('open')">
    <div class="conv-av" style="background:${color}">${init}</div>
    <div class="conv-info">
      <div class="conv-nm">${e(fromName)}</div>
      <div class="conv-em">${e(fromAddr)}</div>
    </div>
    <div class="conv-rt"><div class="conv-ts">${mt}</div>${typeHtml}</div>
    ${mUnread?'<div class="conv-undot"></div>':''}
    <div class="conv-chv">▾</div>
  </div>
  <div class="conv-bd"><div class="conv-bd-inner">
    <div class="conv-grid">
      ${msg.from?`<div class="conv-mk">จาก</div><div class="conv-mv">${e(msg.from)}</div>`:''}
      ${msg.to?`<div class="conv-mk">ถึง</div><div class="conv-mv">${e(msg.to)}</div>`:''}
      ${msg.cc?`<div class="conv-mk">CC</div><div class="conv-mv">${e(msg.cc)}</div>`:''}
    </div>
    <div class="txt-toggle" onclick="event.stopPropagation()">
      <span>แสดงข้อความ</span>
      <button class="txt-btn on" onclick="setTxtMode(this,'wrap')">ต้นฉบับ</button>
      <button class="txt-btn"    onclick="setTxtMode(this,'compact')">ย่อ</button>
    </div>
    <div class="conv-text">${e(msg.snippet||'(ไม่มีเนื้อหา)')}</div>
    ${imgHtml}${fileHtml}
  </div></div>
</div>`;
        });

        html+=`<div class="tl-row">
  <div class="tl-dc"><div class="tl-dn">${d.getDate()}</div><div class="tl-dw">${TH_D[d.getDay()]}</div></div>
  <div class="tl-sp"><div class="tl-nd ${cat.nv}">${cat.icon}</div></div>
  <div class="tl-body">
    <div class="tl-card ${cat.cv}" onclick="toggleCard(this)">
      <div class="c-hd">
        <div class="c-meta">
          <div class="c-r1"><span class="tbdg ${cat.tb}">${cat.label}</span>${unread?'<span class="new-bdg">NEW</span>':''}</div>
          <div class="c-subj${unread?' unread':''}">${e(last.subject||'(ไม่มีหัวข้อ)')}</div>
          <div class="c-snip">${e(last.snippet||'')}</div>
        </div>
        <div class="c-right"><div class="c-time">${time}</div><span class="c-chev">▾</span></div>
      </div>
      <div class="c-tags">${tags.join('')}</div>
      <div class="c-det"><div class="conv-list">${convH}</div></div>
    </div>
  </div>
</div>`;
      });
    });
  });
  feed.innerHTML=html;
}

function toggleCard(c){c.classList.toggle('open')}
function setTxtMode(btn,mode){
  event.stopPropagation();
  const row=btn.closest('.txt-toggle');
  row.querySelectorAll('.txt-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  const txt=row.nextElementSibling;
  if(txt&&txt.classList.contains('conv-text')){
    txt.classList.toggle('compact',mode==='compact');
  }
}
function openLB(src){document.getElementById('lb-img').src=src;document.getElementById('lightbox').classList.add('on')}
function e(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3000)}

// ── Init ──────────────────────────────────────────────────
(()=>{
  const n=new Date();calY=n.getFullYear();calM=n.getMonth();renderCal();
  // Auto-load on start
  fetchData();
})();
</script>
